name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: check / clippy / test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # rustfmt は「整形すべき差分」を artifact として出す。ここでは失敗させず、
      # 続く clippy / test の結果も同じ run で見られるようにする。
      - name: Format (差分を artifact に保存)
        run: |
          cargo fmt --all
          git diff --stat
          git diff > fmt.diff || true
          if [ -s fmt.diff ]; then
            echo "::warning::rustfmt が整形した差分があります (artifact: fmt diff)"
          fi
          git diff --name-only

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fmt-diff
          path: fmt.diff
          if-no-files-found: ignore

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Doc test
        run: cargo test --workspace --all-features --doc

      - name: Terminal demo (ゲームが動いている様子をログに残す)
        run: cargo run --quiet -p mario-core --example ascii_frame -- 1-1
