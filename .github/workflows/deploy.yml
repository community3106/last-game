name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - arena/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Prepare Distribution Assets
        run: |
          mkdir -p dist
          cp -r public/* dist/

      - name: Install Trunk & Build
        run: |
          if ! command -v trunk &> /dev/null; then
            wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.5/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf- -C /usr/local/bin/ || true
          fi
          if command -v trunk &> /dev/null; then
            trunk build --release --public-url "/" || true
          fi
          cp -r public/* dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          echo "Starting Cloudflare Pages deployment..."
          
          # Try creating project if not exists
          npx --yes wrangler pages project create ascii-mario-nostr --production-branch=main || true
          
          # Deploy with wrangler
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx --yes wrangler pages deploy dist \
              --project-name=ascii-mario-nostr \
              --account-id="$CLOUDFLARE_ACCOUNT_ID" \
              --commit-dirty=true \
              --branch=main
          else
            npx --yes wrangler pages deploy dist \
              --project-name=ascii-mario-nostr \
              --commit-dirty=true \
              --branch=main
          fi
