name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - arena/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Prepare Distribution Assets
        run: |
          mkdir -p dist
          cp -r public/* dist/

      - name: Install Trunk & Build
        run: |
          if ! command -v trunk &> /dev/null; then
            wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.5/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf- -C /usr/local/bin/ || true
          fi
          if command -v trunk &> /dev/null; then
            trunk build --release --public-url "/" || true
          fi
          cp -r public/* dist/

      - name: Deploy to Cloudflare Pages
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.ACCOUNT_ID }}
        run: |
          echo "=== Cloudflare Pages Deployment Diagnostic ==="
          if [ -n "$CF_API_TOKEN" ]; then
            echo "API Token: Configured (Length: ${#CF_API_TOKEN} characters)"
          else
            echo "::warning::API Token is not detected in secrets (CLOUDFLARE_API_TOKEN / CLOUDFLARE_TOKEN / CF_API_TOKEN)"
          fi

          if [ -n "$CF_ACCOUNT_ID" ]; then
            echo "Account ID: Configured (Length: ${#CF_ACCOUNT_ID} characters)"
          else
            echo "::warning::Account ID is not detected in secrets (CLOUDFLARE_ACCOUNT_ID / CF_ACCOUNT_ID / ACCOUNT_ID)"
          fi

          # Run Wrangler Deploy
          npx --yes wrangler pages deploy dist \
            --project-name=ascii-mario-nostr \
            --commit-dirty=true \
            --branch=main \
            --skip-fetching-deployments || {
              echo "Retrying without branch flag..."
              npx --yes wrangler pages deploy dist --project-name=ascii-mario-nostr --commit-dirty=true
            }
