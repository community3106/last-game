name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - arena/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Prepare Distribution Assets
        run: |
          mkdir -p dist
          cp -r public/* dist/

      - name: Install Trunk & Build
        run: |
          if ! command -v trunk &> /dev/null; then
            wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.5/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf- -C /usr/local/bin/ || true
          fi
          if command -v trunk &> /dev/null; then
            trunk build --release --public-url "/" || true
          fi
          cp -r public/* dist/

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ascii-mario-nostr --commit-dirty=true --branch=main
