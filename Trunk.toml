build_target = "index.html"
dist = "dist"

[build]
target = "index.html"

[watch]
watch = ["src", "index.html", "style", "public"]

[serve]
address = "0.0.0.0"
port = 3000
open = false

[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", "mkdir -p dist && cp -r public/* dist/ 2>/dev/null || true"]

