[package]
name = "last-game"
version = "0.1.0"
edition = "2021"
description = "100% Rust ASCII Mario - Leptos CSR + Nostr (NIP-04/44) + Stripe + Cloudflare Pages"
repository = "https://github.com/community3106/last-game"
license = "MIT"
keywords = ["leptos", "nostr", "wasm", "game", "ascii"]
categories = ["wasm", "games"]

[dependencies]
# -- Leptos (100% Rust front) --
leptos = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }
console_error_panic_hook = "0.1"
console_log = { version = "1", features = ["trace"] }
log = "0.4"

# -- WASM / DOM --
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window", "Document", "HtmlElement", "KeyboardEvent",
  "Storage", "Headers", "Request", "Response", "fetch"
] }
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-storage = "0.3"
gloo-net = { version = "0.6", features = ["json"] }
gloo-events = "0.2"

# -- Serde --
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

# -- Nostr (back) --
nostr = { version = "0.35", features = ["rand"] }
nostr-sdk = { version = "0.35", features = ["nip04", "nip44"] }

# -- Crypto / Rand --
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
cfg-if = "1"
hex = "0.4"

# -- Utils --
once_cell = "1"
chrono = { version = "0.4", features = ["wasm-bindgen"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0

# Feature for native terminal version (optional)
[features]
default = []
terminal = ["dep:crossterm"]
csr = []

[dependencies.crossterm]
version = "0.27"
optional = true
